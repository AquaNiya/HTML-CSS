<html>
  <head>
    <link rel="stylesheet" href="styles/div_element.css">
  </head>

  <body>
    <div class="red-square"></div>
    <div class="green-circle"></div>

    <div class="satisfaction-card">
      <p class="satisfaction-title">
        Satisfied with our service?
      </p>
      <button>Yes</button>
      <button>No</button>
    </div>

    <div class="music-card">
      <p class="music-title">
        Install YouTube Music
      </p>
      <p class="subtitle">
        Add YouTube Music to your desktop for quick and easy access
      </p>
    </div>

    <div class="cat-card">
      <img
      class="profile-picture"
      src="https://plus.unsplash.com/premium_vector-1719015253440-ccedd0c117c3?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt="Profile picture">
      <input type="text" class="text-box" placeholder="What's happening?">
      <button class="tweet-button">
        Tweet
      </button>
    </div>

     <div class="profile">
      <img class="profile-cat" src="https://plus.unsplash.com/premium_vector-1719015253440-ccedd0c117c3?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt="Profile picture">
      <p class="name">
        Oliver
      </p>
      <p class="mutual-friends">
        2 mutual friends
      </p>
      <button class="add-friend-button">
        Add Friend
      </button>
    </div>

     <div class="profile">
      <img class="profile-pic" src="https://images.unsplash.com/photo-1592304766616-aeadf7817c84?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
      <p class="name">
        Olivya
      </p>
      <p class="mutual-friends">
        2 mutual friends
      </p>
      <button class="add-friend-button">
        Add Friend
      </button>
    </div>
    <div class="profile">
      <img class="profile-pic" src="https://i.pinimg.com/736x/50/ea/04/50ea04d97577842c1609b09aa2632990.jpg">
      <p class="name">
        Mimi
      </p>
      <p class="mutual-friends">
        3 mutual friends
      </p>
      <button class="add-friend-button">
        Add Friend
      </button>
    </div>
    <div class="profile">
      <img class="profile-pic" src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
      <p class="name">
        Rex
      </p>
      <p class="mutual-friends">
        4 mutual friends
      </p>
      <button class="add-friend-button">
        Add Friend
      </button>
    </div>

  </body>
</html>
