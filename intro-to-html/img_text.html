<!DOCTYPE html>
<html>
  <head>
    <title>Images & Text-boxes exercise</title>
    <link rel="stylesheet" href="styles/img_text.css">
  </head>
  <body>
    <img class="image1" src="https://static.vecteezy.com/system/resources/thumbnails/051/778/475/small/an-orange-kitten-sitting-on-a-blanket-photo.jpeg">
    <img class="image2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCIyKIFkjWFHw7PjktMDGmwXJ-u8LAkp58ni7Pz5Ht0Q&s=10">
    <img class="image3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6o6vTkO7Ml5CpmpidJlti67qQomoDQKFMpCsC2HITOw&s=10">
    <input type="text" placeholder="Search">
    <input type="text" placeholder="Search Google or type a URL">

    <p class="label">Email</p>
    <input class="text-box" type="text">
    <p class="disclamer">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p>
    <button class="join-button">
      Agree & Join
    </button>

    <img class="profile-picture" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWoTuM1R69lVaHAO-tAIE65nzRVl7kgpQ-MeIHeCeL3g&s">
    <input type="text" class="text-box" placeholder="What's happening?">
    <button class="tweet-button">
      Tweet
    </button>

  </body>
</html>
